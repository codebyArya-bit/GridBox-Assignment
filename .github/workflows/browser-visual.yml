name: Browser visual regression (Chromium)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check baseline refresh marker
        id: baseline
        shell: bash
        run: |
          if [ -f ../.github/visual-baseline-refresh.request ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate reviewed screenshots once
        if: steps.baseline.outputs.refresh == 'true'
        run: npx playwright test --grep 'visual:' --project=desktop-chromium --project=mobile-chromium --update-snapshots
      - name: Commit updated golden snapshots
        if: steps.baseline.outputs.refresh == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/*-snapshots/*.png
          git -C .. rm -f .github/visual-baseline-refresh.request
          git commit -m 'test: approved v2 hourly and January baselines [skip ci]'
          git push
      - name: Compare screenshots and live hourly/monthly functionality
        run: npx playwright test tests/dashboard.spec.ts --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridbox-v2-browser-evidence
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
