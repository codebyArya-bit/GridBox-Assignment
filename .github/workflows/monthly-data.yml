name: Generate immutable January summary from Elexon
on:
  push:
    branches: [main]
    paths:
      - 'backend/app/core.py'
      - 'backend/scripts/build_monthly.py'
      - '.github/workflows/monthly-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Generate all 31 decisions with historic Elexon records
        run: cd backend && python -m scripts.build_monthly
      - name: Verify summary schema
        run: |
          python - <<'PY'
          import json
          s=json.load(open('backend/data/january_0950.json'))
          assert s['daysCount']==31
          assert len(s['days'])==31
          assert all(d['matchedIntervals']==24 for d in s['days'])
          assert s['aggregate']['matchedHours']==744
          assert sum(b['count'] for b in s['errorDistribution'])==744
          print('Validated monthly snapshot:',s['aggregate'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: january-2026-elexon-audit
          path: backend/data/january_0950.json
          retention-days: 30
      - name: Commit reproducible monthly data snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/january_0950.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Jan 2026 Elexon 09:50 hourly summary [skip ci]'
            git push
          fi
