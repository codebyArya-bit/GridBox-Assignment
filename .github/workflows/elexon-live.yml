name: Elexon live integration test
on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/scripts/live_smoke.py'
      - '.github/workflows/elexon-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elexon:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.live_smoke
