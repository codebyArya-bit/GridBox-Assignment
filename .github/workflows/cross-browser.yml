name: Firefox, WebKit and accessibility
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/cross-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test tests/cross-browser.spec.ts --project=firefox-desktop --project=webkit-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-webkit-a11y-evidence
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
